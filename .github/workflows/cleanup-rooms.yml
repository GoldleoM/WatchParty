name: Clean up empty rooms
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchparty-room-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Remove closed and empty rooms
        env:
          WATCHPARTY_CLEANUP: ${{ secrets.WATCHPARTY_CLEANUP }}
        run: node scripts/cleanup-rooms.mjs
