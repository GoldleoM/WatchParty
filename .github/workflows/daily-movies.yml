name: Refresh daily movies
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-movie-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: python -m pip install requests beautifulsoup4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Read published movie rankings
        id: refresh
        continue-on-error: true
        run: python scripts/refresh-film-feed.py
      - name: Publish refreshed lists
        run: |
          git add public/daily-films.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh daily movie listings'
            git pull --rebase origin master
            git push origin HEAD:master
          fi
      - if: steps.refresh.outcome == 'failure'
        run: exit 1
